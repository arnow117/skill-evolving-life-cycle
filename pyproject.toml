[project]
name = "selc"
version = "0.1.0"
description = "A portable skill evolving life cycle reference implementation"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/selc.py" = ["E402"]
"tests/*.py" = ["E402"]
